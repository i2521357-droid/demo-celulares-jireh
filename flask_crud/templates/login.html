<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso - Celulares Jireh</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <style>
    body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #003366 0%, #00509e 100%); height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
    .login-card { background: #ffffff; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 100%; max-width: 400px; padding: 40px 30px; text-align: center; }
    .login-logo i { font-size: 3rem; color: #00509e; margin-bottom: 10px; }
    .login-title { font-weight: 700; color: #003366; margin-bottom: 30px; letter-spacing: 1px; }
    .form-control { border-radius: 8px; padding: 12px 15px; background-color: #f8f9fa; border: 1px solid #e9ecef; }
    .form-control:focus { border-color: #00509e; box-shadow: 0 0 0 0.2rem rgba(0, 80, 158, 0.25); }
    .btn-login { background-color: #00509e; border: none; padding: 12px; border-radius: 8px; font-weight: 600; letter-spacing: 0.5px; width: 100%; transition: all 0.3s; }
    .btn-login:hover { background-color: #003366; transform: translateY(-2px); }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-logo">
        <i class="fa-solid fa-mobile-screen-button"></i>
    </div>
    <h3 class="login-title">CELULARES JIREH</h3>
    
    <form id="frmLogin">
        <div class="input-group mb-3">
            <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="fa-solid fa-user"></i></span>
            <input type="text" name="usuario" id="usuario" class="form-control border-start-0" placeholder="Nombre de usuario" required>
        </div>
        <div class="input-group mb-4">
            <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
            <input type="password" name="password" id="password" class="form-control border-start-0" placeholder="Contraseña" required>
        </div>
        <button type="submit" class="btn btn-primary btn-login text-white">
            <i class="fa-solid fa-right-to-bracket me-2"></i> INICIAR SESIÓN
        </button>
    </form>
    
    <div id="mensajeLogin" class="mt-3"></div>
  </div>

<script>
$(document).ready(function() {
    $("#frmLogin").submit(function(e) {
        e.preventDefault(); 
        let btn = $(".btn-login");
        let txtOriginal = btn.html();
        
        btn.html('<i class="fa-solid fa-circle-notch fa-spin"></i> Validando...');
        btn.prop('disabled', true);
        
        $.ajax({
            url: '/api/validar_login', 
            method: 'POST',
            data: $(this).serialize(), 
            success: function(respuesta) {
                if(respuesta.status === 'success') {
                    window.location.href = '/';
                } else {
                    $("#mensajeLogin").html('<div class="alert alert-danger mt-2 py-2">' + respuesta.msg + '</div>');
                    btn.html(txtOriginal);
                    btn.prop('disabled', false);
                    $("#password").val(''); 
                }
            },
            error: function() {
                $("#mensajeLogin").html('<div class="alert alert-danger mt-2 py-2">Error en el servidor.</div>');
                btn.html(txtOriginal);
                btn.prop('disabled', false);
            }
        });
    });
});
</script>
</body>
</html>
