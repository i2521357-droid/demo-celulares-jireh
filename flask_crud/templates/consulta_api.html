<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Perú</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .campo { margin-bottom: 10px; }
        pre { background-color: #f4f4f4; padding: 10px; border-radius: 5px; border: 1px solid #ddd; max-width: 600px; white-space: pre-wrap;}
    </style>
</head>
<body>

    <h2>APISPERU</h2>

    <div class="campo">
        <label for="tipo">Tipo de Documento:</label>
        <select id="tipo">
            <option value="dni">DNI</option>
            <option value="ruc">RUC</option>
        </select>
    </div>
    
    <div class="campo">
        <label for="numero">Número:</label>
        <input type="text" id="numero" placeholder="Ej: 71234567" maxlength="11">
    </div>
    
    <div class="campo">
        <label for="token">Token API:</label>
        <!-- Aquí dejé tu token pre-cargado para agilizar las pruebas -->
        <input type="text" id="token" value="eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJlbWFpbCI6ImRhbmllbGl0bzQwNDZAZ21haWwuY29tIiwianRpIjoiNjUzMDk4Yjc1Yjk4OTJjNCJ9.2SMRYXJpblg-y4M9wtH8nUvX40HByW4r45C_grYNO_8" style="width: 300px;">
    </div>
    
    <button onclick="consultar()">Consultar Datos</button>

    <h3>Respuesta:</h3>
    <pre id="resultado">Aquí aparecerá el JSON de respuesta...</pre>

    <script>
        async function consultar() {
            const tipo = document.getElementById("tipo").value;
            const numero = document.getElementById("numero").value.trim();
            const token = document.getElementById("token").value.trim();
            const resultado = document.getElementById("resultado");

            if (!numero || !token) {
                resultado.textContent = "Debe completar el número y verificar el token.";
                return;
            }

            // Validación básica
            if (tipo === "dni" && numero.length !== 8) {
                resultado.textContent = "Error: El DNI debe tener exactamente 8 dígitos.";
                return;
            }

            if (tipo === "ruc" && numero.length !== 11) {
                resultado.textContent = "Error: El RUC debe tener exactamente 11 dígitos.";
                return;
            }

            resultado.textContent = "Cargando respuesta desde el servidor...";

            try {
                // Selecciona la URL base según el tipo de documento
                const baseUrl = tipo === "dni"
                    ? "https://dniruc.apisperu.com/api/v1/dni/"
                    : "https://dniruc.apisperu.com/api/v1/ruc/";

                // Construimos la URL final con el parámetro token
                const urlFinal = baseUrl + numero + "?token=" + encodeURIComponent(token);

                // Hacemos la petición HTTP GET
                const response = await fetch(urlFinal);

                if (!response.ok) {
                    throw new Error("Error HTTP: " + response.status + " - Revisa si el número es correcto o el token es válido.");
                }

                // Convertimos la respuesta a formato JSON
                const data = await response.json();
                
                // Imprimimos el JSON formateado en pantalla
                resultado.textContent = JSON.stringify(data, null, 2);

            } catch (error) {
                resultado.textContent = error.message;
            }
        }
    </script>
</body>
</html>
